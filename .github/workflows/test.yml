name: Test

on:
  push:
    branches: [main]
  pull_request:
  # The Update workflow starts this after it has committed a new formula: a
  # push made with a workflow's own token does not trigger other workflows.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
      # setup-homebrew taps this checkout as shipwick/tap, so this installs the
      # formula of the commit under test, not the published one.
      - run: brew install shipwick/tap/shipwick
      - run: brew test shipwick
      - run: brew audit --strict --formula shipwick/tap/shipwick
      - run: shipwick --version
